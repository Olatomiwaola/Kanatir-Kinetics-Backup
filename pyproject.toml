[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kanatir"
version = "0.1.0"
description = "Urban AI Intelligence Platform — Project Sentinel (Phase 1)"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.4.0",
  "redis>=5.0.0",
  "psycopg[binary]>=3.1.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]
# Sprint 3-4 vision/acoustic pipelines. Installed on the HOST (native arm64),
# not in the linux/amd64 stack containers. On Apple Silicon, TensorFlow is the
# tensorflow-macos wheel; add tensorflow-metal for GPU. Kept out of core deps
# and CI so the lightweight services and lint/test jobs stay torch/TF-free.
pipelines = [
  "opencv-python>=4.9.0",
  "ultralytics>=8.2.0",       # YOLOv8-nano + ByteTrack
  "librosa>=0.10.0",          # MFCC + audio loading
  "sounddevice>=0.4.6",       # live mic capture (APP)
  "tensorflow>=2.16.0",
  "tensorflow-hub>=0.16.0",   # YAMNet
]

[tool.setuptools]
packages = [
    "kanatir",
    "kanatir.core",
    "kanatir.core.udih",
    "kanatir.core.spe",
    "kanatir.core.msfe",
    "kanatir.core.ade",
    "kanatir.core.csat",
    "kanatir.core.xai",
    "kanatir.core.pgc",
    "kanatir.core.aoag",
    "kanatir.pipelines",
    "kanatir.pipelines.common",
    "kanatir.pipelines.cvp",
    "kanatir.pipelines.app",
    "kanatir.pipelines.rap",
    "kanatir.pipelines.esp",
    "kanatir.pipelines.mip",
    "kanatir.modules",
    "kanatir.modules.counter_uas",
    "kanatir.modules.critical_infra",
    "kanatir.modules.env_warning",
    "kanatir.modules.crowd_vehicle",
    "kanatir.modules.rf_anomaly",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring a live database or external service",
]