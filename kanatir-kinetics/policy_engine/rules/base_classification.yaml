# Base classification rules for FusionGuard
# Rules evaluated top-to-bottom. First match wins.

rules:
  - id: "RULE-001"
    name: "Block unclassified data entering Protected B pipeline"
    condition:
      classification: "UNCLASSIFIED"
      pipeline_level: "PROTECTED_B"
    action: "BLOCK"
    reason: "Classification level insufficient for this pipeline"

  - id: "RULE-002"
    name: "Permit Protected B data in Protected B pipeline"
    condition:
      classification: "PROTECTED_B"
      pipeline_level: "PROTECTED_B"
    action: "PERMIT"
    reason: "Classification matches pipeline requirement"

  - id: "RULE-003"
    name: "Flag NOFORN data for release authority check"
    condition:
      caveat: "NOFORN"
    action: "FLAG"
    reason: "NOFORN caveat requires release authority review before sharing"

  - id: "RULE-004"
    name: "Segregate SECRET data from uncleared domains"
    condition:
      classification: "SECRET"
      domain: "NETWORK"
    action: "SEGREGATE"
    reason: "SECRET data must not transit uncontrolled network domain"
