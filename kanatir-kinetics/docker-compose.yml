version: "3.9"

services:
  policy_engine:
    build: .
    command: uvicorn policy_engine.api:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    env_file: .env

  sensor_ingestion:
    build: .
    command: python -m sensor_ingestion.pipeline
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - policy_engine

  operator_ui:
    build: .
    command: uvicorn operator_ui.app:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - policy_engine
